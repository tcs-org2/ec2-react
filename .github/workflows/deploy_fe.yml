
name: Deploy FE vaagon

on:
  # Deploy based on GitHub Release publication.
  release:
    types: [published, released]

  # Manual deployment when required.
  workflow_dispatch:
    inputs:
      target:
        description: Select deployment environment
        required: true
        type: choice
        options:
          - stage
          - production
        default: stage

# Determine target environment from the release type.
# Pre-release = stage
# Normal release = production
# Manual = selected environment

concurrency:
  group: deploy-frontend-${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.event.release.prerelease && 'stage' || 'production') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Automatically select GitHub Environment.
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.event.release.prerelease && 'stage' || 'production') }}

    env:
      AWS_PAGER: ""
      AWS_CLI_AUTO_PROMPT: "off"
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.event.release.prerelease && 'stage' || 'production') }}

    steps:
      # Checkout the exact release tag.
      # For manual execution, checkout the selected branch/ref.
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Display deployment details
        run: |
          echo "================================"
          echo "Deployment Environment: $DEPLOY_ENV"
          echo "Release: ${{ github.event.release.tag_name }}"
          echo "Release Type: ${{ github.event.release.prerelease && 'PRE-RELEASE' || 'PRODUCTION RELEASE' }}"
          echo "Commit: $GITHUB_SHA"
          echo "================================"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --silent --if-present

      # Build using environment-specific backend API URL.
      - name: Build Application
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Keep this step for local act testing.
      # GitHub ubuntu-latest runners generally already have AWS CLI.
      - name: Install AWS CLI (if missing)
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y awscli
          fi

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} \
            --delete \
            --no-progress

      - name: Invalidate CloudFront
        id: invalidate
        run: |
          INVALIDATION_ID=$(aws --no-cli-pager cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DIST }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "Invalidation ID: $INVALIDATION_ID"
          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"

      - name: Smoke Test
        run: |
          sleep 15
          curl -fsS "${{ vars.FRONTEND_URL }}/" > /dev/null
          echo "Frontend reachable: ${{ vars.FRONTEND_URL }}"

      - name: Deployment Summary
        if: success()
        run: |
          echo "Deployment successful!"
          echo "Environment: $DEPLOY_ENV"
          echo "Release: ${{ github.event.release.tag_name }}"
          echo "S3 Bucket: ${{ vars.S3_BUCKET }}"
          echo "CloudFront: ${{ vars.CLOUDFRONT_DIST }}"
          echo "Invalidation ID: ${{ steps.invalidate.outputs.invalidation_id }}"
